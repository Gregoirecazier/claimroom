[project]
name = "claim-subrogation-api"
version = "0.1.0"
description = "FastAPI foundation for a synthetic claims demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.115.12",
  "PyJWT[crypto]==2.10.1",
  "psycopg[binary]==3.2.9",
  "SQLAlchemy==2.0.43",
  "uvicorn==0.34.2",
  "pipelex==0.65.0",
  "logfire[fastapi]==5.1.1",
  "gradium==0.6.4",
  "PyYAML==6.0.3",
  "twilio==9.8.0",
  "imageio-ffmpeg==0.6.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pydantic-evals[logfire]==2.50.0",
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
